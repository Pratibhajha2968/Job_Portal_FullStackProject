name: Claude Security & Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-6
          direct_prompt: |
            Read CLAUDE.md first for project standards.
            Review this PR and report:
            1. SECURITY - hardcoded URLs, auth bypass, missing validation
            2. CODE QUALITY - unused code, bad patterns
            3. PERFORMANCE - unnecessary re-renders, missing deps
            4. MAINTAINABILITY - missing error handling
            Post inline comments on exact line numbers.
            Format: 🔴 Critical / 🟡 Warning / 🔵 Info
